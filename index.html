<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Talking Agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="avatar" id="avatarIcon">🌸</div>
    <div>
      <h1 id="agentName">Aria</h1>
      <p>20 · always here to chat</p>
    </div>
  </div>
  <div class="personas">
    <button class="persona-btn active" data-g="f" id="btnF">Aria · 20F</button>
    <button class="persona-btn" data-g="m" id="btnM">Kai · 20M</button>
  </div>
</header>
<div id="log"></div>
<footer>
  <input type="text" id="textInput" placeholder="Type a message...">
  <button class="action" id="sendBtn">Send</button>
</footer>
<script src="app.js"></script>
</body>
</html>
